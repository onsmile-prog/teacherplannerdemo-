reg({
  id:'planner', label:'Planner', icon:'cal', group:'Planning', title:'Planner',
  sub: function(){ var ws = plWeek(); return 'Week of '+fmtDate(ws,true); },
  acts: function(){ return '<div class="seg"><button data-plmode="week"'+((DB.settings._plMode||'week')==='week'?' class="on"':'')+'>Week</button><button data-plmode="day"'+(DB.settings._plMode==='day'?' class="on"':'')+'>Day</button></div><button class="btn icon" id="plPrev" aria-label="Earlier">'+ic('left')+'</button><button class="btn" id="plToday">Today</button><button class="btn icon" id="plNext" aria-label="Later">'+ic('right')+'</button><button class="btn" id="plCopy">'+ic('layers')+'Copy last week</button><button class="btn" id="plPrint">'+ic('print')+'Print week</button>'; },

  render: function(){
    var v = el('v-planner'), ws = plWeek(), T = todayIso(), mode = DB.settings._plMode||'week';
    var days = [0,1,2,3,4].map(function(i){ return addDays(ws,i); });
    var teach = DB.periods.filter(function(p){ return p.n>=0; });
    var h = '';
    if(mode==='week'){
      h += '<section class="panel"><div class="scroll-x"><div class="pgrid"><div></div>'+days.map(function(d){ var x = parseD(d); return '<div class="ph'+(d===T?' today':'')+'">'+DAYS[x.getDay()].slice(0,3)+' '+x.getDate()+'</div>'; }).join('');
      teach.forEach(function(p){
        h += '<div class="pt">'+esc(p.label)+'<small>'+fmt12(p.start)+'</small></div>' + days.map(function(d){ return plCell(d, p); }).join('');
      });
      h += '</div></div><p class="small muted">Tap a slot to plan it — pick a lesson from the bank or type a quick title. Lessons follow the class colour.</p></section>';
    } else {
      var D = DB.settings._plDay || T; if(daysBetween(ws, D)<0 || daysBetween(ws,D)>4) D = ws;
      h += '<div class="seg" style="margin-bottom:12px">'+days.map(function(d){ var x = parseD(d); return '<button data-plday="'+d+'"'+(d===D?' class="on"':'')+'>'+DAYS[x.getDay()].slice(0,3)+' '+x.getDate()+'</button>'; }).join('')+'</div>';
      h += '<section class="panel dayview"><div class="ch"><p class="lab">'+fmtDate(D,true)+'</p></div>' + DB.periods.map(function(p){
        if(p.n===-1) return '<div class="pcell free" style="cursor:default"><div class="pt" style="width:70px;text-align:left;padding:0">'+fmt12(p.start)+'</div><span class="muted">Lunch</span></div>';
        return plCell(D, p, true);
      }).join('') + '</section>';
    }
    v.innerHTML = h;
  },

  wire: function(){
    document.addEventListener('click', function(e){
      if(!e.target.closest) return;
      var t = e.target.closest('[data-plmode],[data-plday],[data-slot],#plPrev,#plNext,#plToday,#plPrint,#plCopy');
      if(!t || VIEW!=='planner') return;
      if(t.hasAttribute('data-plmode')){ DB.settings._plMode = t.getAttribute('data-plmode'); render(); return; }
      if(t.hasAttribute('data-plday')){ DB.settings._plDay = t.getAttribute('data-plday'); render(); return; }
      if(t.id==='plPrev'){ DB.settings._plWeek = addDays(plWeek(), -7); DB.settings._plDay = DB.settings._plWeek; render(); return; }
      if(t.id==='plNext'){ DB.settings._plWeek = addDays(plWeek(), 7); DB.settings._plDay = DB.settings._plWeek; render(); return; }
      if(t.id==='plToday'){ DB.settings._plWeek = weekStart(todayIso()); DB.settings._plDay = todayIso(); render(); return; }
      if(t.id==='plPrint'){ printWeek(); return; }
      if(t.id==='plCopy'){ copyLastWeek(); return; }
      if(t.hasAttribute('data-slot')){ slotForm(t.getAttribute('data-slot'), +t.getAttribute('data-p')); }
    });
  }
});
function plWeek(){ return DB.settings._plWeek || weekStart(todayIso()); }
function plCell(d, p, dayView){
  var c = classFor(p.n), free = DB.free[p.n], entry = (DB.plan[d]||{})[p.n], T = todayIso();
  var les = entry && typeof entry === 'string' ? find(DB.lessons, entry) : null, quick = entry && typeof entry === 'object' ? entry.title : null;
  var text = les ? les.title : quick ? quick : null, rf = (DB.reflect[d]||{})[p.n];
  var cn = c ? esc(c.name) : (free ? esc(free) : '<span class="faint">free</span>');
  return '<div class="pcell'+(c?'':' free')+(d===T?' today':'')+'" data-slot="'+d+'" data-p="'+p.n+'">'+(c?'<span class="bar" style="background:'+c.colour+'"></span>':'')+
    (dayView?'<div class="pt" style="width:70px;text-align:left;padding:0">'+esc(p.label)+'<small>'+fmt12(p.start)+'</small></div>':'')+

function classForm(rec){

      { key:'colour', label:'Colour', type:'colour' }
    ],
    validate: function(v, r){ return DB.classes.some(function(c){ return c.id!==r.id && c.name.toLowerCase()===v.name.toLowerCase(); }) ? 'There is already a class called '+v.name+'.' : ''; },
    onDelete: function(r){
      var n = studentsIn(r.id).length;
      ask('Remove '+r.name+'?'+(n?' Its '+n+' students stay in the roster with no class.':''), function(){
        DB.students.forEach(function(s){ if(s.classId===r.id) s.classId=''; });

        removeFrom('classes', r.id, 'Class removed');
      }, { danger:true, yes:'Remove class' });

  openForm(spec, init, function(v){

    else { v.id = uid('c'); DB.classes.push(v); if(!DB.settings.activeClass) DB.settings.activeClass = v.id; }

function attendanceRate(classId){
  var days = Object.keys(DB.attendance).sort().slice(-10), tot=0, here=0;
  days.forEach(function(k){ studentsIn(classId).forEach(function(s){ var x = DB.attendance[k][s.id]; if(!x) return; tot++; if(x==='P'||x==='L') here++; }); });
  return tot ? Math.round(here/tot*100) : null;   /* null = nothing taken, never a fake 0% */
}

document.addEventListener('click', function(e){

/* ---- CSV import -------------------------------------------------------
   The one thing a real competitor review asked for. Paste or choose a file;
   columns are mapped by header name (first, last, guardian, phone, email,
   birthday, class) with sensible aliases; "Last, First" in one column works
   too. Nothing is written until the preview is confirmed. */
var CSV_ROWS = null;
function openCsvImport(){
  el('hostIn').className = 'sheet-in wide';
  el('hostIn').innerHTML = '<h2>Import a roster</h2><p class="muted small" style="margin:-8px 0 12px">Paste from a spreadsheet, or choose a .csv. The first row should be the column names — <b>first, last, guardian, phone, email, birthday, class, student id, preferred, pronouns, grade</b>, in any order. A single <b>name</b> column also works.</p>' +
    '<div class="field"><div class="filepick"><input type="file" id="csvFile" accept=".csv,text/csv"><button type="button" class="btn" id="csvChoose">'+ic('up')+'Choose a .csv file</button><span class="small muted" id="csvName">or paste below</span></div></div>' +
    '<div class="field"><textarea class="csvbox" id="csvText" placeholder="first,last,guardian,phone\nAmara,Osei,Rosa Osei,+1 415 555 0101\n…"></textarea></div>' +
    '<div class="field"><label>Put them in</label><select id="csvClass">'+DB.classes.map(function(c){ return '<option value="'+c.id+'"'+(c.id===DB.settings.activeClass?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')+'<option value="">— use the class column —</option></select></div>' +
    '<div id="csvPreview"></div><p class="err" id="csvErr"></p>' +
    '<div class="sheet-cta"><button class="btn ghost" data-close="hostSheet">Cancel</button><button class="btn" id="csvParse">Preview</button><button class="btn primary" id="csvGo" disabled>Import</button></div>';
  CSV_ROWS = null;
  openSheet('hostSheet');
  el('csvChoose').addEventListener('click', function(){ el('csvFile').click(); });
  el('csvFile').addEventListener('change', function(){ var f = this.files && this.files[0]; if(!f) return; el('csvName').textContent = f.name; var r = new FileReader(); r.onload = function(){ el('csvText').value = r.result; previewCsv(); }; r.readAsText(f); });
  el('csvParse').addEventListener('click', previewCsv);
  el('csvGo').addEventListener('click', function(){
    if(!CSV_ROWS) return;
    var forced = el('csvClass').value, n = 0;
    CSV_ROWS.forEach(function(r){
      var classId = forced || (DB.classes.filter(function(c){ return c.name.toLowerCase()===(r.cls||'').toLowerCase(); })[0]||{}).id || DB.settings.activeClass || '';
      var dup = DB.students.filter(function(s){ return s.first.toLowerCase()===r.first.toLowerCase() && s.last.toLowerCase()===r.last.toLowerCase() && s.classId===classId; }).length;
      if(dup) return;
      DB.students.push({ id:uid('s'), first:r.first, last:r.last, preferred:r.preferred||'', pronouns:r.pronouns||'', sid:r.sid||'', grade:r.grade||'', classId:classId, guardian:r.guardian||'', phone:r.phone||'', email:r.email||'', birthday:r.birthday||'', medical:'', notes:'', lexile:0, flags:{iep:false,s504:false,ell:false,medical:false} });
      n++;
    });
    closeSheet('hostSheet'); toast('Imported '+plural(n,'student')+'.'); render();
  });
}
function previewCsv(){
  var rows = parseCsv(el('csvText').value||''); el('csvErr').textContent = '';
  if(rows.length<2){ el('csvErr').textContent = 'Need a header row and at least one student.'; el('csvGo').disabled = true; return; }
  var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function col(names){ for(var i=0;i<names.length;i++){ var j = head.indexOf(names[i]); if(j>-1) return j; } return -1; }
  var cF = col(['first','first name','firstname','given name']), cL = col(['last','last name','lastname','surname','family name']), cN = col(['name','student','student name','full name']);
  var cI = col(['id','student id','studentid','student number','number']), cPref = col(['preferred','preferred name','nickname','goes by']), cPro = col(['pronouns']), cGr = col(['grade','year','grade level','year group']);
  var cG = col(['guardian','parent','guardian name','parent name']), cP = col(['phone','guardian phone','parent phone','mobile']), cE = col(['email','e-mail','guardian email','parent email']), cB = col(['birthday','dob','date of birth','birth date']), cC = col(['class','section','period','group']);
  if(cF<0 && cN<0){ el('csvErr').textContent = 'Could not find a first/last or name column in: '+head.join(', '); el('csvGo').disabled = true; return; }
  CSV_ROWS = rows.slice(1).map(function(r){
    var first = cF>-1 ? r[cF]||'' : '', last = cL>-1 ? r[cL]||'' : '';
    if(cN>-1 && !first){ var n = (r[cN]||'').trim(); if(n.indexOf(',')>-1){ var p = n.split(','); last = p[0].trim(); first = p.slice(1).join(',').trim(); } else { var q = n.split(/\s+/); first = q[0]||''; last = q.slice(1).join(' '); } }
    /* "Kim, Jonah" pasted into a first-name column with the last name blank
       is a whole name in one cell, not a first name with a comma in it */
    if(first.indexOf(',')>-1 && !last.trim()){ var pp = first.split(','); last = pp[0].trim(); first = pp.slice(1).join(',').trim(); }
    return { first:first.trim(), last:last.trim(), guardian:cG>-1?r[cG]:'', phone:cP>-1?r[cP]:'', email:cE>-1?r[cE]:'', birthday:cB>-1?normDate(r[cB]):'', cls:cC>-1?r[cC]:'', sid:cI>-1?(r[cI]||'').trim():'', preferred:cPref>-1?(r[cPref]||'').trim():'', pronouns:cPro>-1?(r[cPro]||'').trim():'', grade:cGr>-1?(r[cGr]||'').trim():'' };
  }).filter(function(r){ return r.first || r.last; });
  el('csvPreview').innerHTML = '<div class="csvprev"><table><thead><tr><th>First</th><th>Last</th><th>Guardian</th><th>Phone</th><th>E-mail</th><th>Birthday</th><th>Class</th></tr></thead><tbody>'+CSV_ROWS.slice(0,50).map(function(r){ return '<tr><td>'+esc(r.first)+'</td><td>'+esc(r.last)+'</td><td>'+esc(r.guardian)+'</td><td>'+esc(r.phone)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.birthday)+'</td><td>'+esc(r.cls)+'</td></tr>'; }).join('')+'</tbody></table></div><p class="small muted" style="margin:6px 0 0">'+plural(CSV_ROWS.length,'student')+' found'+(CSV_ROWS.length>50?' (showing 50)':'')+'. Duplicates already in the class are skipped.</p>';
  el('csvGo').disabled = false;
}
function normDate(s){
  s = (s||'').trim(); if(!s) return '';
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s); if(m) return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  m = /^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/.exec(s); if(m){ var a=+m[1], b=+m[2]; if(a>12) return m[3]+'-'+pad2(b)+'-'+pad2(a); if(b>12) return m[3]+'-'+pad2(a)+'-'+pad2(b); return m[3]+'-'+pad2(b)+'-'+pad2(a); }
  return s;
}
function exportRoster(){
  var out = [['first','last','preferred','pronouns','student id','grade','class','guardian','phone','email','birthday','iep','504','ell','medical','notes','strengths','interests','staff notes']];
  DB.students.slice().sort(by('last')).forEach(function(s){ var f = s.flags||{}; out.push([s.first,s.last,s.preferred||'',s.pronouns||'',s.sid||'',s.grade||'',(cls(s.classId)||{}).name||'',s.guardian,s.phone,s.email,s.birthday,f.iep?'yes':'',f.s504?'yes':'',f.ell?'yes':'',s.medical,s.notes,s.strengths||'',s.interests||'',s.staffNotes||'']); });
  download('roster-'+todayIso()+'.csv', out.map(csvLine).join('\r\n'), 'text/csv');
}

/* share of homework handed in, for the profile and the progress report */
function hwRate(sid){
  var s = stu(sid); if(!s) return '';
  var hw = DB.homework.filter(function(h){ return h.classId===s.classId; }); if(!hw.length) return '';
  var got = hw.filter(function(h){ return h.submitted && h.submitted[sid]; }).length;
  return got+' of '+hw.length+' ('+Math.round(got/hw.length*100)+'%)';
}

/* ---- progress report: one printable page per student ---------------------
   Grades, attendance, homework, reading, behaviour, support and a space for
   a comment - the page a teacher wants in their hand at a parent evening. */
function printProgress(id){
  var s = stu(id); if(!s) return;
  var k = cls(s.classId), T = todayIso();
  var att = { P:0, A:0, L:0, E:0 }; Object.keys(DB.attendance).forEach(function(d){ var x = DB.attendance[d][id]; if(x) att[x]++; });
  var as = DB.assessments.filter(function(a){ return a.classId===s.classId; }).sort(by('due'));
  var av = studentAverage(id);
  var rows = as.map(function(a){ var sc = (DB.scores[a.id]||{})[id], k2 = find(DB.categories,a.catId); return '<tr><td>'+esc(a.title)+'</td><td>'+esc(k2?k2.name:'')+'</td><td>'+fmtDay(a.due)+'</td><td class="r">'+(sc==null?'<i>missing</i>':sc+' / '+a.max)+'</td><td class="r">'+(sc==null?'&mdash;':Math.round(sc/a.max*100)+'%')+'</td></tr>'; }).join('');
  var beh = DB.behavior.filter(function(b){ return b.studentId===id; }).sort(by('date')).reverse();
  var pos = beh.filter(function(b){ return b.type==='positive'; }).length;
  var rd = DB.reading.filter(function(r){ return r.studentId===id; }).sort(by('date')).reverse();
  var ints = DB.interventions.filter(function(i){ return i.studentId===id && i.status!=='closed'; });
  var body = '<h1>'+esc(s.first)+' '+esc(s.last)+(s.preferred?' <small style="font-weight:600;color:#666">(&ldquo;'+esc(s.preferred)+'&rdquo;)</small>':'')+'</h1>' +
    '<p class="m">'+(k?esc(k.name)+' &middot; ':'')+(s.grade?'Grade '+esc(s.grade)+' &middot; ':'')+esc(DB.teacher.name||'')+(DB.teacher.school?' &middot; '+esc(DB.teacher.school):'')+' &middot; '+fmtDate(T,true)+'</p>' +
    '<table><thead><tr><th>Average</th><th>Attendance</th><th>Homework</th><th>Behaviour</th></tr></thead><tbody><tr><td><b style="font-size:16pt">'+(av===null?'&mdash;':av+'% &middot; '+letter(av))+'</b></td><td><b style="font-size:16pt">'+stuAttendance(id)+'%</b><br><small>'+att.P+' present &middot; '+att.A+' absent &middot; '+att.L+' late &middot; '+att.E+' excused</small></td><td><b style="font-size:16pt">'+(hwRate(id)||'&mdash;')+'</b></td><td><b style="font-size:16pt">'+pos+' positive &middot; '+(beh.length-pos)+' concern'+(beh.length-pos===1?'':'s')+'</b></td></tr></tbody></table>' +
    '<h2>Grades</h2>'+(rows?'<table><thead><tr><th>Assessment</th><th>Category</th><th>Due</th><th class="r">Score</th><th class="r">%</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p>No assessments yet.</p>') +
    (rd.length?'<h2>Reading</h2><table><tbody>'+rd.slice(0,5).map(function(r){ return '<tr><td>'+esc(r.book)+'</td><td>'+esc(r.author||'')+'</td><td>'+r.page+' / '+r.total+' pages</td><td>'+esc(r.status)+'</td></tr>'; }).join('')+'</tbody></table>':'') +
    (beh.length?'<h2>Behaviour</h2><table><tbody>'+beh.slice(0,6).map(function(b){ return '<tr><td>'+fmtDay(b.date)+'</td><td>'+(b.type==='positive'?'Positive':'Concern')+'</td><td>'+esc(b.cat)+'</td><td>'+esc(b.note)+'</td></tr>'; }).join('')+'</tbody></table>':'') +
    (ints.length?'<h2>Support</h2>'+ints.map(function(i){ return '<p><b>'+esc(i.focus)+'</b> &mdash; '+esc(i.tier)+'. '+esc(i.strategy||'')+(i.review?' Review '+fmtDay(i.review)+'.':'')+'</p>'; }).join(''):'') +
    '<h2>Teacher comment</h2><div style="border:1px solid #bbb;border-radius:6px;height:110px"></div>' +
    '<p class="m" style="margin-top:18px">Parent / guardian signature: ______________________________ &nbsp;&nbsp; Date: ______________</p>';
  printDoc('Progress report - '+s.first+' '+s.last, body, true);
}

}

function letter(pct){ var sc = DB.settings.gradeScale; for(var i=0;i<sc.length;i++) if(pct>=sc[i][1]) return sc[i][0]; return sc[sc.length-1][0]; }
/* Weighted average for one student across their class's categories.
   Categories with nothing graded are dropped and the remaining weights
   re-normalised, so an empty "Tests" category cannot drag a grade down. */
function studentAverage(sid){
  var s = stu(sid); if(!s) return null;
  var byCat = {}, any = false;
  DB.assessments.filter(function(a){ return a.classId===s.classId; }).forEach(function(a){
    var sc = (DB.scores[a.id]||{})[sid]; if(sc==null) return;
    byCat[a.catId] = byCat[a.catId]||{ got:0, max:0 }; byCat[a.catId].got += sc; byCat[a.catId].max += a.max; any = true;
  });
  if(!any) return null;
  var wsum = 0, acc = 0;
  DB.categories.forEach(function(k){ var b = byCat[k.id]; if(!b || !b.max) return; wsum += +k.weight; acc += (b.got/b.max) * (+k.weight); });
  return wsum ? Math.round(acc/wsum*100) : null;
}
function classAverage(classId){
  var t=0,n=0; studentsIn(classId).forEach(function(s){ var g = studentAverage(s.id); if(g!==null){ t+=g; n++; } });
  return n ? Math.round(t/n) : null;
}
function classAverageAll(){
  var t=0,n=0; DB.classes.forEach(function(c){ var g = classAverage(c.id); if(g!==null){ t+=g; n++; } });
  return n ? Math.round(t/n) : null;
}

  }, rec ? { title:rec.title, classId:rec.classId, catId:rec.catId, max:rec.max, due:rec.due, id:rec.id } : { classId:c?c.id:'', catId:DB.categories[0].id, due:todayIso() },
  function(v){ if(rec){ for(var k in v) rec[k]=v[k]; } else { v.id = uid('a'); DB.assessments.push(v); DB.scores[v.id] = {}; } });
}
function categoriesSheet(){
  el('hostIn').className = 'sheet-in';

    el('hostIn').innerHTML = '<h2>Grade categories</h2><p class="muted small" style="margin:-8px 0 12px">Weights should add up to 100. Right now they add up to <b style="color:'+(wsum===100?'var(--good)':'var(--warm)')+'">'+wsum+'</b>.</p>' +
      DB.categories.map(function(k){ return '<div class="two" style="margin-bottom:8px;grid-template-columns:1fr 90px 36px"><input data-cn="'+k.id+'" value="'+esc(k.name)+'" class="inp"><input type="number" min="0" max="100" data-cw="'+k.id+'" value="'+k.weight+'" class="inp"><button class="btn icon danger" data-cdel="'+k.id+'" aria-label="Remove">'+ic('x',14)+'</button></div>'; }).join('') +
      '<button class="btn sm" id="catAdd">'+ic('plus',14)+'Add category</button><div class="sheet-cta"><button class="btn primary" data-close="hostSheet" id="catDone">Done</button></div>';
  }
  paint(); openSheet('hostSheet');
  el('hostIn').onclick = function(e){
    var t = e.target.closest ? e.target.closest('#catAdd,[data-cdel]') : null; if(!t) return;
    if(t.id==='catAdd'){ DB.categories.push({ id:uid('cat'), name:'New category', weight:0 }); paint(); return; }
    var id = t.getAttribute('data-cdel'), used = DB.assessments.filter(function(a){ return a.catId===id; }).length;
    if(used){ notice('That category has '+plural(used,'assessment')+' in it. Move them to another category first.', 'Category in use'); return; }
    DB.categories = DB.categories.filter(function(k){ return k.id!==id; }); paint();
  };
  el('hostIn').onchange = function(e){
    var i = e.target, k;
    if(i.hasAttribute('data-cn')){ k = find(DB.categories,i.getAttribute('data-cn')); if(k) k.name = i.value.trim()||k.name; }
    if(i.hasAttribute('data-cw')){ k = find(DB.categories,i.getAttribute('data-cw')); if(k) k.weight = clamp(parseFloat(i.value)||0,0,100); }
    paint(); render();
  };
}
function exportGrades(c){
  var as = DB.assessments.filter(function(a){ return a.classId===c.id; }).sort(by('due'));
  var out = [['student'].concat(as.map(function(a){ return a.title+' (/'+a.max+')'; })).concat(['average','grade'])];
  studentsIn(c.id).sort(by('last')).forEach(function(s){ var g = studentAverage(s.id); out.push([s.last+', '+s.first].concat(as.map(function(a){ var v = (DB.scores[a.id]||{})[s.id]; return v==null?'':v; })).concat([g===null?'':g+'%', g===null?'':letter(g)])); });
  download('grades-'+c.name.replace(/\s+/g,'-')+'-'+todayIso()+'.csv', out.map(csvLine).join('\r\n'), 'text/csv');
}
/* ---- missing work: every blank score and unhanded homework, per student ---- */
function missingWork(classId){
  var as = DB.assessments.filter(function(a){ return a.classId===classId; }), hw = DB.homework.filter(function(h){ return h.classId===classId; });
  return studentsIn(classId).sort(by('last')).map(function(s){
    var m = as.filter(function(a){ return (DB.scores[a.id]||{})[s.id]==null; }).map(function(a){ return a.title; });
    var h = hw.filter(function(x){ return !(x.submitted||{})[s.id]; }).map(function(x){ return x.title; });
    return { s:s, scores:m, hw:h, n:m.length+h.length };
  }).filter(function(r){ return r.n; }).sort(function(a,b){ return b.n-a.n; });
}
function openMissingWork(){

  var rows = missingWork(c.id);

    (rows.length ? rows.map(function(r){ return '<div class="row"><span class="avi" style="background:'+c.colour+'">'+initials(r.s.first+' '+r.s.last)+'</span><div class="grow"><div class="n">'+esc(r.s.last)+', '+esc(r.s.first)+'</div><div class="m">'+(r.scores.length?'<span class="tag bad">'+plural(r.scores.length,'score')+'</span> '+esc(r.scores.join(', ')):'')+(r.hw.length?' <span class="tag warm">'+plural(r.hw.length,'homework')+'</span> '+esc(r.hw.join(', ')):'')+'</div></div><span class="tag">'+r.n+'</span></div>'; }).join('') : '<p class="empty">Nothing missing. Every score is in and every homework is handed in.</p>') +
    '<div class="sheet-cta"><button class="btn ghost" data-close="hostSheet">Close</button>'+(rows.length?'<button class="btn primary" id="mwPrint">'+ic('print')+'Print</button>':'')+'</div>';
  openSheet('hostSheet');
  var pb = el('mwPrint'); if(pb) pb.addEventListener('click', function(){
    printDoc('Missing work - '+c.name, '<h1>Missing work</h1><p class="m">'+esc(c.name)+' &middot; '+fmtDate(todayIso(),true)+'</p><table><thead><tr><th>Student</th><th>Scores missing</th><th>Homework not in</th></tr></thead><tbody>'+rows.map(function(r){ return '<tr><td>'+esc(r.s.last+', '+r.s.first)+'</td><td>'+esc(r.scores.join(', ')||'&mdash;')+'</td><td>'+esc(r.hw.join(', ')||'&mdash;')+'</td></tr>'; }).join('')+'</tbody></table>', true);
  });
}

      if(t.id==='seatShuffle'){ var ids = []; for(var k3 in S.seats) ids.push(S.seats[k3]); for(var i=ids.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var tmp = ids[i]; ids[i]=ids[j]; ids[j]=tmp; } var keys = Object.keys(S.seats); keys.forEach(function(k4, idx){ S.seats[k4] = ids[idx]; }); render(); return; }
      if(t.id==='seatClear'){ ask('Clear every seat for '+c.name+'? Everyone goes back to the not-seated list.', function(){ S.seats = {}; render(); }, { danger:true, yes:'Clear seats' }); return; }

/* ---- drag and drop ------------------------------------------------------
   Pick a name up from the pool or from a desk and drop it on any desk. A
   mouse drags as soon as it moves; a finger has to hold for a moment first,
   so scrolling the room still works. Dropping on an occupied desk swaps;
   dropping a seated student back on the pool unseats them. Tap-then-tap
   still works for anyone who prefers it. */
var DRAG = null;
function wireSeatDrag(){
  var hold = null, start = null, armed = false;
  function begin(src, sid, x, y){
    DRAG = { sid:sid, from:src, ghost:document.createElement('div') };
    DRAG.ghost.className = 'drag-ghost'; DRAG.ghost.textContent = stuShort(sid); document.body.appendChild(DRAG.ghost);
    document.body.classList.add('dragging'); move(x, y);
  }
  function targetAt(x, y){ var e = document.elementFromPoint(x, y); return e ? (e.closest('.desk') || e.closest('.pool-panel')) : null; }
  function move(x, y){
    if(!DRAG) return;
    DRAG.ghost.style.left = x+'px'; DRAG.ghost.style.top = y+'px';
    var t = targetAt(x, y); if(DRAG.over && DRAG.over !== t) DRAG.over.classList.remove('over');
    DRAG.over = t; if(t) t.classList.add('over');
  }
  function end(x, y){
    if(!DRAG){ clearTimeout(hold); start = null; armed = false; return; }
    var t = targetAt(x, y), c = activeClass(), S = c ? seatOf(c.id) : null, sid = DRAG.sid, from = DRAG.from;
    if(DRAG.over) DRAG.over.classList.remove('over');
    document.body.removeChild(DRAG.ghost); document.body.classList.remove('dragging'); DRAG = null; start = null; armed = false;
    if(!S || !t) return;
    if(t.classList.contains('desk')){
      var key = t.getAttribute('data-desk'), was = S.seats[key];
      for(var k in S.seats) if(S.seats[k]===sid) delete S.seats[k];
      if(was && was !== sid && from) S.seats[from] = was;    /* swap: the occupant takes the vacated desk */
      S.seats[key] = sid;
    } else if(from){ delete S.seats[from]; }                 /* dropped on the pool: unseated */
    DB.settings._seatSel = ''; DB.settings._seatStu = ''; render();
  }
  document.addEventListener('pointerdown', function(e){
    if(VIEW !== 'seating' || e.button) return;
    var chip = e.target.closest ? e.target.closest('[data-pool]') : null, desk = e.target.closest ? e.target.closest('.desk.has') : null;
    if(!chip && !desk) return;
    var c = activeClass(); if(!c) return; var S = seatOf(c.id);
    var sid = chip ? chip.getAttribute('data-pool') : S.seats[desk.getAttribute('data-desk')]; if(!sid) return;
    start = { x:e.clientX, y:e.clientY, sid:sid, from: desk ? desk.getAttribute('data-desk') : null, touch: e.pointerType !== 'mouse' };
    armed = false; clearTimeout(hold);
    if(start.touch) hold = setTimeout(function(){ if(start){ armed = true; begin(start.from, start.sid, start.x, start.y); } }, 220);
  });
  document.addEventListener('pointermove', function(e){
    if(!start) return;
    if(!DRAG){
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if(start.touch){ if(Math.abs(dx) + Math.abs(dy) > 10) { clearTimeout(hold); start = null; } return; }   /* a finger that moves early is scrolling */
      if(Math.abs(dx) + Math.abs(dy) > 6){ armed = true; begin(start.from, start.sid, e.clientX, e.clientY); }
      return;
    }
    move(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', function(e){ if(DRAG){ e.preventDefault(); } end(e.clientX, e.clientY); });
  document.addEventListener('pointercancel', function(){ if(DRAG){ if(DRAG.over) DRAG.over.classList.remove('over'); document.body.removeChild(DRAG.ghost); document.body.classList.remove('dragging'); } DRAG = null; start = null; clearTimeout(hold); });
  /* while a drag is live the page must not scroll under the finger */
  document.addEventListener('touchmove', function(e){ if(DRAG) e.preventDefault(); }, {passive:false});
  /* a tap that became a drag must not also fire the tap handler */
  document.addEventListener('click', function(e){ if(armed){ e.stopPropagation(); e.preventDefault(); armed = false; } }, true);
}

/* ---- standards coverage: every code named anywhere, and where it appears ----
   Lessons, units and the map all carry a free-text "standards" field; this
   splits them on commas / spaces and counts, so "have I actually taught
   8.EE.7?" has an answer. A lesson counts as taught once it has sat on a
   planner day that is in the past. */
function standardsHtml(){
  var T = todayIso(), codes = {};
  function add(code, where){ code = code.trim(); if(!code) return; codes[code] = codes[code] || { lessons:0, taught:0, units:0, map:0 }; codes[code][where]++; }
  function split(s){ return String(s||'').split(/[,;\s]+/); }
  var taughtLesson = {}; for(var d in DB.plan) if(d < T) for(var pn in DB.plan[d]) if(typeof DB.plan[d][pn]==='string') taughtLesson[DB.plan[d][pn]] = 1;
  DB.lessons.forEach(function(l){ split(l.standards).forEach(function(c){ add(c,'lessons'); if(taughtLesson[l.id]) add(c,'taught'); }); });
  DB.units.forEach(function(u){ split(u.standards).forEach(function(c){ add(c,'units'); }); });
  DB.mapItems.forEach(function(m){ split(m.standards).forEach(function(c){ add(c,'map'); }); });
  var keys = Object.keys(codes).sort(); if(!keys.length) return '';
  return '<section class="panel" style="margin-top:12px"><div class="ch"><p class="lab">Standards coverage</p><span class="chip">'+plural(keys.length,'code')+'</span></div><div class="tbl"><table><thead><tr><th>Standard</th><th class="c">On the map</th><th class="c">In units</th><th class="c">Lessons</th><th class="c">Taught</th></tr></thead><tbody>'+keys.map(function(k){ var c = codes[k]; return '<tr><td><b>'+esc(k)+'</b></td><td class="c">'+(c.map||'—')+'</td><td class="c">'+(c.units||'—')+'</td><td class="c">'+(c.lessons||'—')+'</td><td class="c">'+(c.taught?'<span class="tag a">'+c.taught+'</span>':'<span class="faint">not yet</span>')+'</td></tr>'; }).join('')+'</tbody></table></div><p class="small muted" style="margin:8px 0 0">"Taught" counts a lesson once it has been on a planner day that has passed.</p></section>';
}

var BRAIN_BREAKS = [
  ['Stand and stretch','Reach for the ceiling, roll the shoulders, shake out the hands. Thirty seconds, then sit.'],
  ['Would you rather','Read two options; students move to the left or right of the room to vote. Three rounds.'],

  ['Desk drum','Clap a rhythm; the class repeats it on their desks. Make it longer each time.'],

      if(t.id==='backupBtn'){ DB.settings.lastBackup = todayIso(); var out = {}; for(var bk in DB) out[bk] = DB[bk]; out._app = { name:'Teacher Planner', version:APP_VERSION, saved:new Date().toISOString() }; download('teacher-planner-backup-'+todayIso()+'.json', JSON.stringify(out, null, 1)); render(); return; }
      if(t.id==='restoreBtn'){ el('restoreFile').click(); return; }
      if(t.id==='demoBtn'){ ask('Replace everything here with the example classroom? Your own classes, students and grades will be overwritten.', function(){ DB = demo(); paintStatus(); switchView('dashboard'); }, { danger:true, yes:'Load the example', title:'Replace your data?' }); return; }
      if(t.id==='resetBtn'){ ask('Delete everything and start empty? This cannot be undone. Save a backup first if you might want any of it back.', function(){ DB = blank(); paintStatus(); switchView('dashboard'); startWizard(WIZ_STEPS, function(){ paintStatus(); render(); }); }, { danger:true, yes:'Delete everything', title:'Reset everything?' }); }
    });
    v.addEventListener('change', function(e){
      var i = e.target, n;
      if(i.id==='restoreFile'){ var f = i.files && i.files[0]; if(!f) return; var r = new FileReader(); r.onload = function(){ try{ var got = JSON.parse(r.result); if(!got || !got.classes || !got.students) throw 0; delete got._app; DB = got; migrate(); paintStatus(); toast('Backup restored.'); switchView('dashboard'); }catch(x){ notice('That file does not look like a Teacher Planner backup. Backups are the .json file that "Save a backup" gives you.', 'Could not restore'); } }; r.readAsText(f); i.value=''; return; }
      if(i.hasAttribute('data-ps')){ n = +i.getAttribute('data-ps'); DB.periods.forEach(function(p){ if(p.n===n && i.value) p.start = i.value; }); }
      if(i.hasAttribute('data-pe')){ n = +i.getAttribute('data-pe'); DB.periods.forEach(function(p){ if(p.n===n && i.value){ p.end = i.value; if(p.end <= p.start) notice(p.label+' ends before it starts. Check the two times.', 'Check the times'); } }); }
      if(i.hasAttribute('data-gs-l') || i.hasAttribute('data-gs-m')){ gsRead(); gsNormalise(); render(); return; }
      if(i.hasAttribute('data-free')){ n = +i.getAttribute('data-free'); if(i.value.trim()) DB.free[n] = i.value.trim(); else delete DB.free[n]; }
      if(i.id==='yStart') DB.settings.yearStart = i.value; if(i.id==='yEnd') DB.settings.yearEnd = i.value;
      if((i.id==='yStart' || i.id==='yEnd') && DB.settings.yearStart && DB.settings.yearEnd && DB.settings.yearEnd < DB.settings.yearStart) notice('The school year ends before it starts. Check the two dates.', 'Check the dates');
      paintStatus(); save();
    });
  }
});
/* the grade scale rows on the page -> settings, then sorted high to low with the floor at 0 */
function gsRead(){
  var rows = [].slice.call(document.querySelectorAll('#gsRows .gsrow'));
  DB.settings.gradeScale = rows.map(function(r){ var l = r.querySelector('[data-gs-l]'), m = r.querySelector('[data-gs-m]'); return [l.value.trim(), Math.max(0, Math.min(100, parseFloat(m.value)||0))]; });
}
function gsNormalise(){
  var sc = DB.settings.gradeScale.filter(function(g){ return g[0] !== '' || g[1] !== 0; });
  if(!sc.length) sc = GS_PRESETS[0][1].map(function(g){ return [g[0], g[1]]; });
  sc.sort(function(a,b){ return b[1]-a[1]; }); sc[sc.length-1][1] = 0;
  DB.settings.gradeScale = sc;
}
/* help: three short pages, in the app, no internet needed */
function helpSheet(kind){
  var h;
  if(kind==='start') h = '<h2>Getting started</h2><ol class="help">' +
    '<li><b>Classes</b> - add each group you teach. The period decides where it sits in the day.</li>' +
    '<li><b>Students</b> - Import CSV pastes a roster straight from any spreadsheet, or add them one by one.</li>' +
    '<li><b>Planner</b> - tap a slot and pick a lesson from the bank or type a quick title. The bank holds what you reuse.</li>' +
    '<li><b>Every morning</b> - Home shows what is now and next, birthdays and anything that needs attention. The register takes thirty seconds.</li>' +
    '<li><b>Settings</b> - your name and school, the bell times, the grade scale, light or dark.</li>' +
    '<li><b>Save a backup</b> now and then. The file is the only copy of your data - it restores on any device.</li></ol>';
  else if(kind==='tips') h = '<h2>Tips</h2><ul class="help">' +
    '<li><b>Search anything</b> with Ctrl+K (or the / key) from any screen.</li>' +
    '<li><b>CSV</b> - the first row is the column names: first, last, guardian, phone, email, birthday, class - in any order. "Last, First" in one column works too.</li>' +
    '<li><b>Moving to a new laptop or phone</b> - Save a backup, send the file to yourself, Restore it there. Each device keeps its own data.</li>' +
    '<li><b>Printing</b> - progress report, week plan, substitute pack, missing work, groups and coupons all print as a clean A4 page.</li>' +
    '<li><b>Phone and iPad</b> - open the file in Safari or Chrome and Add to Home Screen for an icon.</li>' +
    '<li><b>Seating</b> - drag a name onto a desk. On a phone the not-seated list swipes up from the bottom.</li>' +
    '<li><b>Quick add</b> on Home is the fastest way to log something mid-lesson.</li>' +
    '<li><b>After a lesson</b> - open the slot in the Planner and write how it went. It is collected under the lesson in the bank.</li></ul>';
  else h = '<h2>What is new</h2><p class="lab" style="margin:8px 0 4px">Version 1.1</p><ul class="help">' +
    '<li>Backup reminder on Home when it has been two weeks</li><li>A note beside any attendance mark (why they were away)</li>' +
    '<li>Copy last week in the Planner; Duplicate in the Lessons bank</li><li>"How did it go?" on any taught slot, collected under the lesson</li>' +
    '<li>Strengths, interests and notes for staff on every student - printed in the substitute pack</li><li>One-tap behaviour chips on the profile</li>' +
    '<li>Grade scale editor: A-F, 9-1, 1-4 or your own</li><li>Checks for duplicate names and dates the wrong way round</li>' +
    '<li>Keyboard focus rings and screen-reader labels throughout</li></ul>' +
    '<p class="lab" style="margin:12px 0 4px">Version 1.0</p><ul class="help"><li>First release - 24 screens, two looks, offline, one file.</li></ul>';
  el('hostIn').className = 'sheet-in';
  el('hostIn').innerHTML = h + '<div class="sheet-cta"><button class="btn ghost" data-close="hostSheet">Close</button></div>';
  openSheet('hostSheet');
}
</script>
<script>/* =====================================================================
   BOOT — load, build the shell, run the wizard on a blank book, render.
   ===================================================================== */
var WIZ_STEPS = [
  {
    title: 'Who is this planner for?',
    lead: 'A name for the greeting, and where you teach. All optional; all editable later in Settings.',
    body: function(){
      return '<div class="field"><label for="wName">Your name</label><input id="wName" placeholder="Dana Whitfield" value="'+esc(DB.teacher.name)+'"></div>' +
        '<div class="two"><div class="field"><label for="wSchool">School</label><input id="wSchool" placeholder="Riverside Middle" value="'+esc(DB.teacher.school)+'"></div>' +
        '<div class="field"><label for="wRoom">Room</label><input id="wRoom" placeholder="B12" value="'+esc(DB.teacher.room)+'"></div></div>' +
        '<div class="field"><label for="wRole">What you teach <em>(optional)</em></label><input id="wRole" placeholder="Grade 8 · Science & Maths" value="'+esc(DB.teacher.role)+'"></div>';
    },
    save: function(){
      DB.teacher.name = str('wName'); DB.teacher.first = str('wName').split(' ')[0];
      DB.teacher.school = str('wSchool'); DB.teacher.room = str('wRoom'); DB.teacher.role = str('wRole');
    }
  },
  {
    title: 'Your classes',
    lead: 'One line each. You can add rooms, colours and rosters afterwards. Leave a line blank to skip it.',
    body: function(){
      var rows = '';
      for(var i=0;i<6;i++){
        var c = DB.classes[i] || {};
        rows += '<div class="two" style="margin-bottom:8px"><input id="wc'+i+'" placeholder="'+(i===0?'Science 8A':i===1?'Maths 8B':'Class name')+'" value="'+esc(c.name||'')+'" class="inp">' +
          '<select id="wp'+i+'" class="inp">'+DB.periods.filter(function(p){ return p.n>=0; }).map(function(p){ return '<option value="'+p.n+'"'+((c.period!=null?c.period:i+1)===p.n?' selected':'')+'>'+esc(p.label)+'</option>'; }).join('')+'</select></div>';
      }
      return rows;
    },
    save: function(){
      var out = [];
      for(var i=0;i<6;i++){
        var n = str('wc'+i); if(!n) continue;
        var prev = DB.classes[i] || {};
        out.push({ id: prev.id || uid('c'), name:n, subject:'', grade:'', room:DB.teacher.room||'', colour: prev.colour || COLOURS[out.length % COLOURS.length], period:+el('wp'+i).value });
      }
      DB.classes = out;
      if(out.length) DB.settings.activeClass = out[0].id;
    }
  },
  {
    title: 'The bell schedule',
    lead: 'When each period starts and ends. The dashboard uses this to know what is happening right now.',
    body: function(){
      return DB.periods.filter(function(p){ return p.n!==-1; }).map(function(p, i){
        return '<div class="cols3" style="margin-bottom:8px;align-items:center"><span style="font-weight:700">'+esc(p.label)+'</span>' +
          pickHtml('ws'+p.n, 'time', p.start) + pickHtml('we'+p.n, 'time', p.end) + '</div>';
      }).join('');
    },
    save: function(){
      DB.periods.forEach(function(p){ if(p.n===-1) return; var a = el('ws'+p.n), b = el('we'+p.n); if(a && a.value) p.start = a.value; if(b && b.value) p.end = b.value; });
    }
  },
  {
    title: 'Students can come in from a spreadsheet',
    lead: 'Later, on the Students screen, you can paste or import a CSV of your rosters — typing thirty names by hand is nobody’s idea of a good evening. For now, that is everything.',
    body: function(){
      return '<div class="alert ok">'+ic('check')+'<div><b>Nothing you enter leaves this device</b><span>No account, no sync, no internet needed. Keep a backup from Settings now and then.</span></div></div>';
    },
    save: function(){ DB.settings.setup = true; }
  }
];

function boot(){
  load();
  buildShell();
  wireSheets();
  wireForm(); wireSearch(); wirePickers(); wireAsk(); wireGo(); wireBell();
  MODS.forEach(function(m){ if(m.wire) m.wire(); });
  paintStatus();
  switchView('dashboard');

  if(!DB.settings.setup){
    startWizard(WIZ_STEPS, function(){ paintStatus(); render(); });
    el('setupDemo').addEventListener('click', function(){
      DB = demo(); el('setup').hidden = true; paintStatus(); switchView('dashboard');
    });
  }
  /* the clock and the "now" strip tick without a reload */
  setInterval(function(){ paintStatus(); if(VIEW==='dashboard') render(); }, 60000);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>

<script>
(function(){
  var ETSY = '';
  window.addEventListener('load', function(){
    var b = document.createElement('div');
    b.id = 'demoBanner';
    b.style.cssText = 'margin:0 0 12px;padding:11px 14px;border-radius:14px;background:var(--ink);color:var(--ground);display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12.5px;font-weight:700;line-height:1.45';
    var txt = document.createElement('span'); txt.style.cssText = 'flex:1;min-width:220px';
    txt.textContent = 'Free demo \u2014 have a proper play, everything works. Nothing you type is saved here: reload and the example classroom comes back.';
    b.appendChild(txt);
    function pill(label, primary){ var a = document.createElement('a'); a.href = '#'; a.textContent = label;
      a.style.cssText = 'text-decoration:none;padding:8px 14px;border-radius:99px;font-weight:800;white-space:nowrap;cursor:pointer;' + (primary ? 'background:var(--a);color:#fff' : 'background:rgba(255,255,255,.14);color:inherit'); return a; }
    function fresh(){ DB = blank(); DB.settings.mode = 'light'; paintStatus(); switchView('dashboard'); startWizard(WIZ_STEPS, function(){ paintStatus(); render(); }); }
    var f = pill('Start fresh', false); f.addEventListener('click', function(e){ e.preventDefault(); fresh(); }); b.appendChild(f);
    var r = pill('Reset example', false); r.addEventListener('click', function(e){ e.preventDefault(); location.reload(); }); b.appendChild(r);
    if(ETSY){ var buy = pill('Get the full version \u2192', true); buy.href = ETSY; buy.target = '_blank'; buy.rel = 'noopener'; b.appendChild(buy); }
    var main = document.querySelector('.main');
    if(main) main.insertBefore(b, main.firstChild);
    /* the app only wires "load a full example classroom" when it boots INTO the wizard; the demo boots
       with the example already loaded, so after Start fresh that link needs a handler of its own */
    var ex = document.getElementById('setupDemo');
    if(ex) ex.addEventListener('click', function(){ DB = demo(); document.getElementById('setup').hidden = true; paintStatus(); switchView('dashboard'); });
  });
})();
</script>
